[project]
name = "repo-pulse-lite"
version = "0.1.0"
description = "Personal GitHub starred repos snapshot tool"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "plotly>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "db", "github", "report"]
