[project]
name = "repo-pulse-lite"
version = "0.1.0"
description = "Personal GitHub starred repos snapshot tool"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
